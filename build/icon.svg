<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0e1e2a"/>
      <stop offset="0.55" stop-color="#081119"/>
      <stop offset="1" stop-color="#04080d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5566" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#16323f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2b5566" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cy" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7df7e0"/>
      <stop offset="0.45" stop-color="#3ce7ca"/>
      <stop offset="1" stop-color="#18b39c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#34e5c8" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#34e5c8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#34e5c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34e5c8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#34e5c8" stop-opacity="0.04"/>
    </radialGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- 扫描扇区 -->
    <path d="M256 256 L368 144 A158 158 0 0 1 414 256 Z" fill="url(#sweep)"/>

    <g fill="none" stroke="url(#cy)" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="256" cy="256" r="140" stroke-width="28"/>
      <circle cx="256" cy="256" r="74" stroke-width="18" opacity="0.9"/>
      <path d="M256 256L356 156" stroke-width="22"/>
    </g>

    <!-- 琥珀色弧段：发现 -->
    <path d="M90.5 285.2 A168 168 0 0 1 127.3 364" fill="none" stroke="#f5b544" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

    <!-- 光点 -->
    <circle cx="256" cy="256" r="19" fill="#8bffe8"/>
    <circle cx="256" cy="256" r="34" fill="none" stroke="#34e5c8" stroke-width="6" opacity="0.55"/>
    <circle cx="336" cy="318" r="15" fill="#f5b544"/>
    <circle cx="196" cy="202" r="11" fill="#34e5c8" opacity="0.85"/>

    <!-- 内描边 -->
    <rect x="4" y="4" width="504" height="504" rx="109" fill="none" stroke="url(#edge)" stroke-width="8"/>
  </g>
</svg>
