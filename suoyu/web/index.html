<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天鉴·索舆 · 资产侦察平台</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">
        <div class="boot-ring"></div>
        <div class="boot-text">天鉴·索舆 正在载入</div>
      </div>
    </div>
    <style>
      .boot-splash {
        height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; background: #060b11; color: #77909f;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; font-size: 13px;
        letter-spacing: 2px;
      }
      .boot-ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 2px solid rgba(52, 229, 200, 0.16); border-top-color: #34e5c8;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
